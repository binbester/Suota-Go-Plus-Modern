name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Java 11 einrichten # <--- NEU: Zwingend für Android 13 benötigt
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '11'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2.0.0

    - name: Pakete wiederherstellen (Restore)
      run: nuget restore suota_pgp/suota_pgp.sln

    - name: App kompilieren (Nur das Android-Projekt) # <--- NEU: Gezielter Pfad
      run: msbuild suota_pgp/suota_pgp/suota_pgp.Android/suota_pgp.Android.csproj /p:Configuration=Release /t:SignAndroidPackage

    - name: APK als Download bereitstellen
      uses: actions/upload-artifact@v4
      with:
        name: Suota-App-APK
        path: '**/*-Signed.apk' # <--- Zieht direkt die fertig signierte App
