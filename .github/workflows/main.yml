name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2.0.0

    - name: Pakete wiederherstellen (Restore)
      run: nuget restore suota_pgp/suota_pgp.sln # <--- Hier ist der Pfad korrigiert

    - name: App kompilieren (Build)
      run: msbuild suota_pgp/suota_pgp.sln /p:Configuration=Release /t:SignAndroidPackage # <--- Und hier auch

    - name: APK als Download bereitstellen
      uses: actions/upload-artifact@v4
      with:
        name: Suota-App-APK
        path: '**/*.apk'
